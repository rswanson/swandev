# Routing cases for swandev:prosecuting
# expect:     this prompt MUST invoke the named skill
# expect_not: this prompt MUST NOT invoke the named skill
# Run with: python3 evals/run.py --skill prosecuting

skill: swandev:prosecuting
cases:
  - prompt: "attack this diff from an API ergonomics angle"
    expect: swandev:prosecuting
  - prompt: "build the harshest possible case that this change is bad, security angle only"
    expect: swandev:prosecuting
  - prompt: "prosecute this diff for correctness issues, be exhaustive"
    expect: swandev:prosecuting
  - prompt: "poke every hole you can in this change from a performance perspective"
    expect: swandev:prosecuting
  - prompt: "be maximally adversarial about the test coverage in this branch's diff"
    expect: swandev:prosecuting
  - prompt: "write up an adversarial findings file on this diff for the architectural drift lens"
    expect: swandev:prosecuting
  - prompt: "review this diff before i merge it"
    expect_not: swandev:prosecuting
  - prompt: "check my changes for bugs and style"
    expect_not: swandev:prosecuting
  - prompt: "run the tribunal on this PR"
    expect_not: swandev:prosecuting
  - prompt: "adversarial review this whole branch from every angle"
    expect_not: swandev:prosecuting
  - prompt: "judge the findings files in .reviews and tell me which are real"
    expect_not: swandev:prosecuting
  - prompt: "fix the issues the review found"
    expect_not: swandev:prosecuting
  - prompt: "the test panics on nil, help me figure out why"
    expect_not: swandev:prosecuting
  - prompt: "open a PR for this branch"
    expect_not: swandev:prosecuting
